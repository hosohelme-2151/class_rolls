<html dir="rtl" lang="ar">

  <!-- مكتبة html2canvas لتحويل التصميم إلى صورة قابلة للتحميل -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    body {
      font-family: Tahoma, Arial, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .preserve-3d { transform-style: preserve-3d; }
    .perspective-1000 { perspective: 1000px; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      top: -10px;
      width: 15px;
      height: 15px;
      background-color: #f00;
      animation: fall 3s linear forwards;
      z-index: 50;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
    
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }

    @keyframes scale-in-center {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .scale-in-center { animation: scale-in-center 0.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both; }

    @keyframes alarm-glow {
      0%, 100% { box-shadow: 0 0 50px rgba(225,29,72,0.4); }
      50% { box-shadow: 0 0 90px rgba(225,29,72,0.9); }
    }
    .animate-alarm-glow { animation: alarm-glow 1s ease-in-out infinite; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    @media (min-width: 768px) { ::-webkit-scrollbar { width: 12px; height: 12px; } }
    ::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    .custom-scrollbar { overflow-y: auto; overflow-x: auto; }

    /* Utilities */
    .hidden-content { display: none !important; }
    .max-h-0 { max-height: 0px; }
    .max-h-96 { max-height: 24rem; }
    .max-h-[600px] { max-height: 600px; }
    .opacity-0 { opacity: 0; }
    .opacity-100 { opacity: 1; }
    
    #app-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      height: 100vh;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      padding-top: 6rem;
      padding-bottom: 8rem;
    }
    @media (min-width: 768px) {
      main { padding: 4rem; padding-top: 9rem; padding-bottom: 10rem; }
    }
  </style>
</head>

    function showConfetti() {
      const container = document.getElementById('confetti-container');
      container.innerHTML = '';
      container.classList.remove('hidden-content');
      
      const colors = ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444', '#ec4899'];

    // ============ Floating Timer Widget ============
    function timerFormat(totalSec) {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function timerPlayChimeOnce() {
      try {
        if (!timer_audioContext) {
          timer_audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        const ctx = timer_audioContext;
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        const notes = [880, 659.25, 880];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const t = now + i * 0.28;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(0.4, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(t);
          osc.stop(t + 0.55);
        });
      } catch (e) { console.error('Timer audio error:', e); }
    }

    function timerStartRinging() {
      timer_isRinging = true;
      timer_isOpen = true;
      timerPlayChimeOnce();
      timer_ringIntervalId = setInterval(timerPlayChimeOnce, 1800);
      renderTimerWidget();
    }

    function timerStopRinging() {
      timer_isRinging = false;
      if (timer_ringIntervalId) { clearInterval(timer_ringIntervalId); timer_ringIntervalId = null; }
    }

    window.timerToggleOpen = function() {
      if (timer_isRinging) { timer_isOpen = true; renderTimerWidget(); return; }
      timer_isOpen = !timer_isOpen;
      renderTimerWidget();
    }

    window.timerSetDuration = function(seconds) {
      if (timer_isRunning) return;
      timer_totalSeconds = seconds;
      timer_remainingSeconds = seconds;
      renderTimerWidget();
    }

    window.timerAdjust = function(deltaSeconds) {
      if (timer_isRunning) return;
      let next = timer_totalSeconds + deltaSeconds;
      next = Math.max(30, Math.min(3600, next));
      timer_totalSeconds = next;
      timer_remainingSeconds = next;
      renderTimerWidget();
    }

    window.timerStart = function() {
      if (timer_remainingSeconds <= 0 || timer_isRunning) return;
      if (!timer_audioContext) {
        timer_audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (timer_audioContext.state === 'suspended') timer_audioContext.resume();

      timer_isRunning = true;
      timer_intervalId = setInterval(() => {
        timer_remainingSeconds--;
        if (timer_remainingSeconds <= 0) {
          timer_remainingSeconds = 0;
          clearInterval(timer_intervalId);
          timer_intervalId = null;
          timer_isRunning = false;
          timerStartRinging();
        } else {
          renderTimerWidget();
        }
      }, 1000);
      renderTimerWidget();
    }

    window.timerPause = function() {
      if (timer_intervalId) { clearInterval(timer_intervalId); timer_intervalId = null; }
      timer_isRunning = false;
      renderTimerWidget();
    }

    window.timerReset = function() {
      if (timer_intervalId) { clearInterval(timer_intervalId); timer_intervalId = null; }
      timer_isRunning = false;
      timer_remainingSeconds = timer_totalSeconds;
      renderTimerWidget();
    }

    window.timerDismiss = function() {
      timerStopRinging();
      timerReset();
    }

    window.timerTestSound = function() {
      if (!timer_audioContext) {
        timer_audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (timer_audioContext.state === 'suspended') timer_audioContext.resume();
      timerPlayChimeOnce();
    }

    function renderTimerWidget() {
      const container = document.getElementById('timer-widget-container');
      if (!container) return;

      let pillClasses = 'bg-slate-800 border-slate-600 text-slate-200';
      let pillIcon = 'timer';
      let pillIconExtra = '';
      if (timer_isRinging) {
        pillClasses = 'bg-gradient-to-r from-rose-600 to-red-600 border-rose-400 text-white animate-alarm-glow';
        pillIcon = 'bell-ring';
        pillIconExtra = 'animate-bounce';
      } else if (timer_isRunning) {
        pillClasses = 'bg-gradient-to-r from-blue-600 to-indigo-600 border-blue-400 text-white shadow-[0_0_25px_rgba(59,130,246,0.5)]';
        pillIconExtra = 'animate-pulse';
      } else if (timer_remainingSeconds !== timer_totalSeconds) {
        pillClasses = 'bg-gradient-to-r from-amber-500 to-orange-600 border-amber-400 text-white';
        pillIcon = 'pause';
      }

      const pillHtml = `
        <button onclick="timerToggleOpen()" class="fixed top-4 left-4 md:top-8 md:left-8 z-40 flex items-center gap-2 md:gap-4 px-4 py-3 md:px-7 md:py-5 rounded-full font-black shadow-2xl border-2 md:border-4 transition-all hover:scale-105 ${pillClasses}">
          <i data-lucide="${pillIcon}" class="w-6 h-6 md:w-9 md:h-9 ${pillIconExtra}"></i>
          <span class="text-xl md:text-3xl tabular-nums">${timerFormat(timer_remainingSeconds)}</span>
        </button>
      `;

      let panelHtml = '';
      if (timer_isOpen) {
        let innerHtml = '';
        if (timer_isRinging) {
          innerHtml = `
            <i data-lucide="bell-ring" class="w-20 h-20 md:w-32 md:h-32 text-rose-400 animate-bounce"></i>
            <h2 class="text-4xl md:text-7xl font-black text-rose-400">انتهى الوقت!</h2>
            <button onclick="timerDismiss()" class="px-10 py-6 md:px-16 md:py-8 bg-gradient-to-r from-rose-600 to-red-600 hover:scale-105 rounded-full text-2xl md:text-4xl font-bold text-white transition-all shadow-lg flex items-center gap-3">
              <i data-lucide="bell-off" class="w-8 h-8 md:w-10 md:h-10"></i> إيقاف الجرس
            </button>
          `;
        } else {
          const presets = [60, 180, 300, 600, 900];
          const presetsHtml = presets.map(sec => `
            <button onclick="timerSetDuration(${sec})" ${timer_isRunning ? 'disabled' : ''} class="px-5 py-3 md:px-8 md:py-5 rounded-2xl text-lg md:text-2xl font-bold border-2 transition-all disabled:opacity-40 ${timer_totalSeconds === sec ? 'bg-blue-600 border-blue-400 text-white' : 'bg-slate-700 border-slate-600 text-slate-300 hover:bg-slate-600'}">
              ${Math.floor(sec / 60)} د
            </button>
          `).join('');

          const controlBtn = timer_isRunning
            ? `<button onclick="timerPause()" class="flex items-center gap-3 px-8 py-5 md:px-14 md:py-8 bg-gradient-to-r from-amber-500 to-orange-600 hover:scale-105 rounded-full text-2xl md:text-4xl font-bold text-white transition-all shadow-lg"><i data-lucide="pause" class="w-8 h-8 md:w-10 md:h-10"></i>إيقاف مؤقت</button>`
            : `<button onclick="timerStart()" ${timer_remainingSeconds <= 0 ? 'disabled' : ''} class="flex items-center gap-3 px-8 py-5 md:px-14 md:py-8 bg-gradient-to-r from-emerald-500 to-teal-600 hover:scale-105 rounded-full text-2xl md:text-4xl font-bold text-white transition-all shadow-lg disabled:opacity-40"><i data-lucide="play" class="w-8 h-8 md:w-10 md:h-10"></i>ابدأ</button>`;

          innerHtml = `
            <h2 class="text-3xl md:text-5xl font-bold text-white flex items-center gap-3 md:gap-4">
              <i data-lucide="timer" class="w-8 h-8 md:w-12 md:h-12 text-blue-400"></i> المؤقت
            </h2>

            <div class="text-7xl md:text-[9rem] font-black tabular-nums leading-none ${timer_isRunning ? 'text-blue-400' : 'text-white'}">
              ${timerFormat(timer_remainingSeconds)}
            </div>

    // Handlers for Discipline Board
    window.dbSetClass = function(c) { db_selectedClass = c; renderApp(); }
    
    window.dbAdjustEscalation = function(studentId, delta) {
      const idx = classData[db_selectedClass].findIndex(s => s.id === studentId);
      if (idx > -1) {
        let student = classData[db_selectedClass][idx];
        let newLevel = student.escalationLevel + delta;
        if (newLevel < 0) newLevel = 0;
        
        // Handling Score deduction when going 5+
        if (newLevel >= 5 && delta > 0) {
          student.participationScore = Math.max(0, student.participationScore - 0.5);
        } else if (student.escalationLevel >= 5 && newLevel < 5 && delta < 0) {
          // Optional: Restore score if dropping below 5
          student.participationScore += 0.5;
        }

        student.escalationLevel = newLevel;

        if (delta > 0) { // Only show popups on increase
          if (newLevel === 3) {
            db_popup = { type: 'danger', message: 'تم تسجيل المخالفة.. بانتظار الإبلاغ على كلاسيرا وحرمانه من الفسحة.', studentName: student.name };
          } else if (newLevel === 4) {
            const randomTask = PENALTY_TASKS[Math.floor(Math.random() * PENALTY_TASKS.length)];
            db_popup = { type: 'research', message: `مهمة إلزامية: ${randomTask}`, studentName: student.name };
          }
        }
      }
      renderApp();
    }

    window.dbClosePopup = function() { db_popup = null; renderApp(); }
    
    window.dbOpenLogModal = function(studentId) {
      db_activeStudent = classData[db_selectedClass].find(s => s.id === studentId);
      renderApp();
    }
    window.dbCloseLogModal = function() { db_activeStudent = null; renderApp(); }

    window.dbSaveLog = function() {
      const descInput = document.getElementById('db-desc-input').value;
      const periodInput = document.getElementById('db-period-select').value;
      const typeInput = document.querySelector('input[name="classType"]:checked').value;
      
      if (!descInput.trim()) {
        alert('الرجاء إدخال وصف المخالفة');
        return;
      }

      const now = new Date();
      const newLog = {
        id: Date.now().toString(),
        date: now.toLocaleDateString('ar-EG'),
        time: now.toLocaleTimeString('ar-EG'),
        studentId: db_activeStudent.id,
        name: db_activeStudent.name,
        classId: db_selectedClass,
        level: db_activeStudent.escalationLevel,
        desc: descInput,
        period: periodInput,
        classType: typeInput
      };

      disciplineLogs.push(newLog);
      localStorage.setItem('disciplineLogs', JSON.stringify(disciplineLogs));
      
      db_activeStudent = null;
      renderApp();
    }

    window.dbOpenWheel = function() { db_showWheel = true; renderApp(); }
    window.dbCloseWheel = function() { db_showWheel = false; renderApp(); }
    
    window.dbSpinWheel = function() {
      if (db_isSpinning) return;
      db_isSpinning = true;
      
      const spins = 5;
      // اختيار مهمة محددة مسبقاً قبل الدوران
      const selectedTaskIndex = Math.floor(Math.random() * PENALTY_TASKS.length);
      
      // حساب الزاوية المطلوبة لوقوف المؤشر على القسم الصحيح
      // كل قسم يأخذ 60 درجة، ولجعل القسم المطلوب يتوقف في الأعلى نطرح زاوية منتصفه من 360
      const targetAngle = 360 - (selectedTaskIndex * 60 + 30);
      
      // إضافة نسبة تفاوت بسيطة (+/- 20 درجة) حتى لا يقف المؤشر في المنتصف تماماً في كل مرة
      const offset = Math.floor(Math.random() * 40) - 20;
      
      // حساب الدوران الإضافي وضبط الزوايا السابقة
      const currentRotationMod = db_wheelRotation % 360;
      const degreesToZero = currentRotationMod > 0 ? 360 - currentRotationMod : 0;
      
      db_wheelRotation = db_wheelRotation + degreesToZero + (spins * 360) + targetAngle + offset;
      renderApp();

      setTimeout(() => {
        db_isSpinning = false;

              <button onclick="lbSetClass('G10A')" class="w-full max-w-[300px] aspect-square md:w-80 md:h-80 rounded-[3rem] bg-gradient-to-br from-orange-600 to-amber-600 hover:scale-105 transition-all shadow-[0_0_40px_rgba(234,88,12,0.4)] flex flex-col items-center justify-center border-4 border-orange-400 group">
                <span class="text-5xl md:text-7xl font-black text-white">G10A</span>
              </button>
            </div>
          </div>
        `;
      } else {
        const currentStudents = classData[lb_selectedClass];
        
        // فرز الطلاب تنازلياً حسب النقاط
        const sorted = [...currentStudents].sort((a, b) => lbGetScore(b) - lbGetScore(a));
        const top5 = sorted.slice(0, 5);

        // إعداد ترتيب وتصميم المنصات (المركز الرابع، الثاني، الأول، الثالث، الخامس) للعرض بشكل هرمي
        const podiumConfig = [
          { rank: 4, index: 3, height: 'h-32 md:h-40', color: 'bg-slate-700/80', border: 'border-slate-500', medal: 'text-slate-400' },
          { rank: 2, index: 1, height: 'h-48 md:h-60', color: 'bg-slate-300/90', border: 'border-slate-200', medal: 'text-slate-200' },
          { rank: 1, index: 0, height: 'h-64 md:h-80', color: 'bg-gradient-to-t from-yellow-600 to-yellow-400', border: 'border-yellow-200', medal: 'text-yellow-100' },
          { rank: 3, index: 2, height: 'h-40 md:h-52', color: 'bg-orange-700/80', border: 'border-orange-500', medal: 'text-orange-300' },
          { rank: 5, index: 4, height: 'h-24 md:h-32', color: 'bg-slate-700/80', border: 'border-slate-500', medal: 'text-slate-400' },
        ];

        let podiumHtml = podiumConfig.map(conf => {
          const student = top5[conf.index];
          if (!student) return '<div class="w-1/5 max-w-[120px]"></div>'; // مساحة فارغة إذا لم يكتمل العدد

          // تعديل: استخدام png بدلاً من svg لتتوافق تماماً مع مكتبة التصدير html2canvas
          const avatarUrl = `https://api.dicebear.com/7.x/adventurer/png?seed=${encodeURIComponent(student.name)}&backgroundColor=b6e3f4`;
          const shortName = student.name.split(' ').slice(0, 2).join(' ');

          return `
            <div class="flex flex-col items-center justify-end w-1/5 max-w-[140px] px-1 animate-fade-in-up">
              <div class="relative mb-2 md:mb-4 group">
                <img src="${avatarUrl}" class="w-16 h-16 md:w-24 md:h-24 rounded-full border-4 ${conf.border} shadow-lg bg-white transition-transform group-hover:scale-110" crossorigin="anonymous" />
                <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-8 h-8 md:w-10 md:h-10 rounded-full font-black flex items-center justify-center text-white border-2 border-white shadow-md ${conf.color} ${conf.medal} text-sm md:text-lg z-20">
                  ${conf.rank}
                </div>
              </div>
              <div class="w-full ${conf.height} ${conf.color} rounded-t-xl md:rounded-t-3xl border-t-4 ${conf.border} shadow-2xl flex flex-col items-center justify-start pt-4 px-2 text-center relative overflow-hidden">
                <div class="absolute inset-0 bg-white/10"></div>
                <span class="text-xs md:text-lg font-bold text-slate-900 drop-shadow-sm z-10 leading-tight md:mb-1">${shortName}</span>
                <span class="text-[10px] md:text-sm font-black text-slate-800 z-10 bg-white/30 px-2 rounded-full mt-1">${lbGetScore(student)} نقطة</span>
              </div>
            </div>
          `;
        }).join('');

        let gridHtml = currentStudents.map((s) => {
          return `
            <div class="bg-slate-800 rounded-2xl p-4 border-2 border-slate-700 flex flex-col items-center text-center gap-3 hover:border-slate-500 transition-colors shadow-lg">
              <span class="w-8 h-8 rounded-full bg-slate-700 text-slate-300 font-bold flex items-center justify-center shrink-0 shadow-inner">${s.num}</span>
              <span class="text-white font-bold text-lg h-12 flex items-center leading-tight">${s.name.split(' ').slice(0, 3).join(' ')}</span>
              
              <div class="w-full bg-slate-900/50 p-2 md:p-3 rounded-xl flex flex-col xl:flex-row justify-between items-center gap-2 mt-auto border border-slate-700/50">
                <span class="text-yellow-400 font-black text-2xl drop-shadow-md">${lbGetScore(s)}</span>
                <div class="flex gap-1 md:gap-2">
                  <button onclick="lbAddParticipation('${s.id}')" title="مشاركة مميزة" class="p-2 md:p-3 rounded-xl transition-all active:scale-95 border-b-4 bg-slate-700 border-slate-900 text-yellow-400 hover:bg-slate-600 hover:text-yellow-300">
                    <i data-lucide="star" class="w-5 h-5 md:w-6 md:h-6"></i>
                  </button>
                  <button onclick="lbToggleTool('${s.id}')" title="أدوات كاملة" class="p-2 md:p-3 rounded-xl transition-all active:scale-95 border-b-4 ${s.toolsReady ? 'bg-indigo-500 border-indigo-700 text-white shadow-[0_0_15px_rgba(79,70,229,0.5)] translate-y-1 border-b-0' : 'bg-slate-700 border-slate-900 text-slate-400 hover:bg-slate-600'}">
                    <i data-lucide="pen-tool" class="w-5 h-5 md:w-6 md:h-6"></i>
                  </button>
                  <button onclick="lbToggleAssessment('${s.id}')" title="إتمام التقييم" class="p-2 md:p-3 rounded-xl transition-all active:scale-95 border-b-4 ${s.assessmentDone ? 'bg-emerald-500 border-emerald-700 text-white shadow-[0_0_15px_rgba(16,185,129,0.5)] translate-y-1 border-b-0' : 'bg-slate-700 border-slate-900 text-slate-400 hover:bg-slate-600'}">
                    <i data-lucide="check-square" class="w-5 h-5 md:w-6 md:h-6"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        container.innerHTML = `
          <div class="flex flex-col w-full h-full max-w-7xl mx-auto py-4 md:py-8 animate-fade-in px-2 md:px-0">
            
            <div class="flex flex-col lg:flex-row justify-between items-center gap-4 mb-8 bg-slate-800 p-4 md:p-6 rounded-3xl border border-slate-700 shadow-lg">
              <div class="flex items-center gap-4 md:gap-6 w-full lg:w-auto">
                <button onclick="lbSetClass(null)" class="bg-slate-700 hover:bg-slate-600 p-3 md:p-4 rounded-full text-white transition-colors">
                  <i data-lucide="chevron-down" class="rotate-90 w-6 h-6 md:w-8 md:h-8"></i>
                </button>
                <h2 class="text-2xl md:text-4xl font-bold text-white flex items-center gap-3">
                  <span class="text-yellow-400">${lb_selectedClass}</span> - تقييم ونجوم الفصل
                </h2>
              </div>
              <div class="flex flex-col sm:flex-row w-full lg:w-auto gap-3">
                <button onclick="lbDownloadImage()" class="flex-1 justify-center items-center gap-3 px-6 py-4 bg-gradient-to-r from-yellow-600 to-amber-500 hover:from-yellow-500 hover:to-amber-400 text-white rounded-2xl text-xl font-bold transition-all shadow-[0_0_20px_rgba(245,158,11,0.4)] flex">
                  <i data-lucide="camera" class="w-6 h-6"></i> تحميل صورة الأوائل
                </button>
                <button onclick="lbDownloadWordReport()" class="flex-1 justify-center items-center gap-3 px-6 py-4 bg-gradient-to-r from-blue-600 to-indigo-500 hover:from-blue-500 hover:to-indigo-400 text-white rounded-2xl text-xl font-bold transition-all shadow-[0_0_20px_rgba(59,130,246,0.4)] flex">
                  <i data-lucide="file-text" class="w-6 h-6"></i> تقرير الدرجات (Word)
                </button>
              </div>
            </div>

            <!-- المنصة (Podium) -->
            <div id="podium-capture" class="w-full flex flex-col items-center justify-end pt-12 pb-0 px-4 bg-slate-900 rounded-[2rem] md:rounded-[3rem] border-4 border-slate-700 relative overflow-hidden mb-8 shadow-2xl">
              <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-900/40 via-slate-900 to-slate-900"></div>
              
              <h2 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-yellow-500 mb-8 md:mb-16 z-10 drop-shadow-xl text-center">
                نجوم فصل ${lb_selectedClass} 🌟
              </h2>
              
              <div class="flex items-end justify-center gap-1 md:gap-4 z-10 w-full max-w-5xl px-2">
                ${podiumHtml}
              </div>
            </div>

            <!-- لوحة تحكم التقييم السريع -->
            <h3 class="text-2xl text-slate-300 font-bold mb-4 px-2">لوحة التقييم السريع (أدوات وتقييمات):</h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 overflow-y-auto pb-24 custom-scrollbar pr-2">
              ${gridHtml}
            </div>

          </div>
        `;
      }
    }

    window.lbSetClass = function(c) { lb_selectedClass = c; renderApp(); }
    
    window.lbToggleTool = function(studentId) {
      const idx = classData[lb_selectedClass].findIndex(s => s.id === studentId);
      if(idx > -1) {
        classData[lb_selectedClass][idx].toolsReady = !classData[lb_selectedClass][idx].toolsReady;
      }
      renderApp();
    }

    window.lbToggleAssessment = function(studentId) {
      const idx = classData[lb_selectedClass].findIndex(s => s.id === studentId);
      if(idx > -1) {
        classData[lb_selectedClass][idx].assessmentDone = !classData[lb_selectedClass][idx].assessmentDone;
      }
      renderApp();
    }

    window.lbAddParticipation = function(studentId) {
      const idx = classData[lb_selectedClass].findIndex(s => s.id === studentId);
      if(idx > -1) {
        // زيادة درجة المشاركة بمقدار 1
        classData[lb_selectedClass][idx].participationScore += 1;
        // استخراج الاسم الأول والثاني فقط
        const studentName = classData[lb_selectedClass][idx].name.split(' ').slice(0, 2).join(' ');
        triggerCelebration(studentName);
      }
      renderApp();
    }

    function triggerCelebration(name) {
      // 1. إظهار القصاصات الملونة
      showConfetti();
      
      // 2. تشغيل صوت الاحتفال
      playCelebrationSound();

      // 3. إظهار الاسم بخط عريض بحركة تفاعلية
      const overlay = document.getElementById('celebration-overlay');
      const nameEl = document.getElementById('celebration-name');
      if(overlay && nameEl) {
        nameEl.innerText = name;
        overlay.classList.remove('hidden-content');
        
        setTimeout(() => {
          overlay.classList.add('hidden-content');
        }, 2500); // إخفاء النافذة بعد ثانيتين ونصف
      }
    }

    function playCelebrationSound() {
      try {
        if (!timer_audioContext) timer_audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const ctx = timer_audioContext;
        if (ctx.state === 'suspended') ctx.resume();
        
        // 1. نغمة النجاح السريعة
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
        osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.2); // C6
        
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1);

        // 2. محاكاة صوت التصفيق (عبر تقطيع ضوضاء بيضاء)
        for(let i=0; i<8; i++) {
          setTimeout(() => {
              if (ctx.state === 'suspended') return;
              const bufferSize = ctx.sampleRate * 0.15; 
              const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
              const data = buffer.getChannelData(0);
              // توليد ضوضاء
              for (let j = 0; j < bufferSize; j++) { data[j] = Math.random() * 2 - 1; }
              const noise = ctx.createBufferSource();
              noise.buffer = buffer;
              
              // فلترة الضوضاء لتبدو مثل التصفيق
              const noiseFilter = ctx.createBiquadFilter();
              noiseFilter.type = 'bandpass';
              noiseFilter.frequency.value = 1000 + (Math.random() * 500);
              
              const noiseGain = ctx.createGain();
              noiseGain.gain.setValueAtTime(0.4, ctx.currentTime);
              noiseGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
              
              noise.connect(noiseFilter);
              noiseFilter.connect(noiseGain);
              noiseGain.connect(ctx.destination);
              noise.start(ctx.currentTime);
          }, i * 50 + 100);
        }
      } catch (e) { console.error('Audio error:', e); }
    }

    window.lbDownloadImage = function() {
      const target = document.getElementById('podium-capture');
      if(!target) return;
      
      // إصلاح مشكلة تدرج النص: تغيير التنسيق لحظة الالتقاط
      const titleEl = target.querySelector('h2');
      const originalTitleClasses = titleEl.className;
      titleEl.className = "text-3xl md:text-5xl font-black text-yellow-400 mb-8 md:mb-16 z-10 text-center";

      const originalBorder = target.style.border;
      target.style.border = 'none'; // إزالة الحدود الخارجية للصورة لتبدو أنظف

      html2canvas(target, { 
        backgroundColor: '#0f172a', 
        scale: 2, 
        useCORS: true // هام جداً للسماح بتحميل الصور من DiceBear
      }).then(canvas => {
        titleEl.className = originalTitleClasses; // إعادة تنسيق العنوان
        target.style.border = originalBorder; // إعادة الحدود
        const link = document.createElement('a');
        link.download = `نجوم_فصل_${lb_selectedClass}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        titleEl.className = originalTitleClasses; // إعادة تنسيق العنوان في حالة الخطأ
        target.style.border = originalBorder;
        console.error("Error capturing podium:", err);
        alert("حدث خطأ أثناء التقاط الصورة. يرجى المحاولة مرة أخرى.");
      });
    }

    window.lbDownloadWordReport = function() {
      if (!lb_selectedClass) return;

      const currentStudents = classData[lb_selectedClass];
      const sortedStudents = [...currentStudents].sort((a, b) => lbGetScore(b) - lbGetScore(a));

      let tableRows = sortedStudents.map((s, index) => {
        return `
          <tr>
            <td style="border: 1px solid #000; padding: 8px; text-align: center;">${index + 1}</td>
            <td style="border: 1px solid #000; padding: 8px;">${s.name}</td>
            <td style="border: 1px solid #000; padding: 8px; text-align: center; font-weight: bold; color: #047857;">${lbGetScore(s)}</td>
            <td style="border: 1px solid #000; padding: 8px; text-align: center;">${s.toolsReady ? '✅ نعم' : '❌ لا'}</td>
            <td style="border: 1px solid #000; padding: 8px; text-align: center;">${s.assessmentDone ? '✅ نعم' : '❌ لا'}</td>
          </tr>
        `;
      }).join('');

      let htmlContent = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40' dir="rtl">
        <head>
          <meta charset="utf-8">
          <title>تقرير درجات الفصل</title>
          <style>
            body { font-family: 'Arial', 'Tahoma', sans-serif; direction: rtl; }
            table { width: 100%; border-collapse: collapse; margin-top: 20px; }
            th { background-color: #f1f5f9; border: 2px solid #000; padding: 12px; font-size: 16px; }
            td { font-size: 14px; }
            h1 { text-align: center; color: #1e3a8a; border-bottom: 2px solid #1e3a8a; padding-bottom: 10px; }
            .date-stamp { text-align: left; color: #64748b; font-size: 12px; margin-bottom: 20px; }
          </style>
        </head>
        <body>
          <h1>تقرير درجات ونجوم الفصل: ${lb_selectedClass}</h1>
          <div class="date-stamp">تاريخ التقرير: ${new Date().toLocaleDateString('ar-EG')}</div>
          <table>
            <thead>
              <tr>
                <th>الترتيب</th>
                <th>اسم الطالب</th>
                <th>إجمالي النقاط</th>
                <th>إحضار الأدوات</th>
                <th>إتمام التقييم</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows}
            </tbody>
          </table>
        </body>
        </html>
      `;

      // إضافة (BOM) لضمان تعرف Microsoft Word على اللغة العربية بترميز UTF-8
      const blob = new Blob(['\ufeff', htmlContent], {
          type: 'application/msword'
      });
      const url = URL.createObjectURL(blob);
      const filename = `تقرير_درجات_${lb_selectedClass}_${new Date().toLocaleDateString('ar-EG').replace(/\//g, '-')}.doc`;

      const downloadLink = document.createElement("a");
      downloadLink.href = url;
      downloadLink.download = filename;
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
      URL.revokeObjectURL(url);
    }

    window.onload = function() {
      renderApp();
    };

  </script>
</body>
